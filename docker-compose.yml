services:
  app: # Frontend Vue.js
    image: node:20
    working_dir: /app
    volumes:
      - ./front:/app
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - drivncook-net

  api: # Backend Laravel
    build:
      context: ./api
      dockerfile: ../docker/api/Dockerfile
    volumes:
      - ./api:/var/www
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    networks:
      - drivncook-net
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: drivncook_m2
      MYSQL_USER: drivnuser
      MYSQL_PASSWORD: drivnpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
      - ./insert_drivncook_data.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - drivncook-net

  nginx: # ✅ Ici c’est correct maintenant
    image: nginx:1.25
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/dist:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    depends_on:
      - app
      - api

networks:
  drivncook-net:

volumes:
  db_data:
