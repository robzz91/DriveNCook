services:
  app:
    image: node:20
    working_dir: /app
    volumes:
      - ./front:/app
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - drivncook-net
  api:
    build:
      context: ./api
      dockerfile: ../docker/api/Dockerfile
    volumes:
      - ./api:/var/www/html
    ports:
      - "8000:80"
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=drivncook_m2
      - DB_USERNAME=drivnuser
      - DB_PASSWORD=drivnpass
    networks:
      - drivncook-net
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: drivncook_m2
      MYSQL_USER: drivnuser
      MYSQL_PASSWORD: drivnpass
      MYSQL_ROOT_PASSWORD: rootpass
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci"
    ]
    volumes:
     - db_data:/var/lib/mysql
     - ./bdd.sql:/docker-entrypoint-initdb.d/001-init.sql
    ports:
      - "3307:3306"
    networks:
     - drivncook-net

  nginx:
    image: nginx:1.25
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./front/dist:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    depends_on:
      - api
    networks:
      - drivncook-net

networks:
  drivncook-net:

volumes:
  db_data:
