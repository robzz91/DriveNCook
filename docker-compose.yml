services:
  app:
    image: node:20
    working_dir: /app
    volumes:
      - ./front:/app
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - drivncook-net
  api:
    build:
      context: ./api
      dockerfile: ../docker/api/Dockerfile
    volumes:
      - ./api:/var/www/html
    ports:
      - "8000:80"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=drivncook_m2
      - DB_USERNAME=drivnuser
      - DB_PASSWORD=drivnpass
      - DB_INIT=0
    networks:
      - drivncook-net
    # depends_on supprimé: API se connecte à MySQL externe

  # Simplification: plus de base MySQL locale
  # db:
  #   image: mysql:8.0
  #   restart: always
  #   environment:
  #     MYSQL_DATABASE: drivncook_m2
  #     MYSQL_USER: drivnuser
  #     MYSQL_PASSWORD: drivnpass
  #     MYSQL_ROOT_PASSWORD: rootpass
  #   volumes:
  #     - db_data:/var/lib/mysql
  #     - ./bdd.sql:/docker-entrypoint-initdb.d/001-init.sql
  #   networks:
  #     - drivncook-net

  # db supprimé: utilisation de la base MySQL externe

  nginx:
    image: nginx:1.25
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./front/dist:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    depends_on:
      - api

networks:
  drivncook-net:
