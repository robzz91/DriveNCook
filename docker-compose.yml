services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: drivncook
      MYSQL_USER: drivn
      MYSQL_PASSWORD: drivnpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports: ["3307:3306"]
    volumes: [ "dbdata:/var/lib/mysql" ]

  api:
    build: ./docker/api
    working_dir: /var/www/html
    volumes: [ "./api:/var/www/html" ]
    environment:
      DB_HOST: db
      DB_DATABASE: drivncook
      DB_USERNAME: drivn
      DB_PASSWORD: drivnpass
    ports: ["8000:8000"]
    depends_on: [ db ]

  app:
    image: node:20
    working_dir: /app
    command: sh -c "npm i && npm run dev -- --host"
    volumes: [ "./front:/app" ]
    ports: ["5173:5173"]
    depends_on: [ api ]

  nginx:
    image: nginx:1.25
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./front/dist:/usr/share/nginx/html:ro
    ports: ["8080:80"]
    depends_on: [ app, api ]

volumes:
  dbdata:
