<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion Admin - Drive'N'Cook</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;background:#fff;margin:0}
      .wrap{max-width:420px;margin:12vh auto;padding:24px;border:2px solid #000;border-radius:8px}
      h1{margin:0 0 16px;color:#d32}
      label{display:block;margin:8px 0 4px}
      input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}
      button{margin-top:12px;width:100%;background:#ffcc00;border:none;padding:10px;border-radius:6px;font-weight:600}
      .muted{color:#666;font-size:12px;margin-top:8px}
      .err{color:#c00;margin-top:8px}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Admin - Connexion</h1>
      <label>Email</label>
      <input id="email" placeholder="admin@example.com" value="admin@example.com" />
      <label>Mot de passe</label>
      <input id="password" type="password" placeholder="password" value="password" />
      <button id="loginBtn">Se connecter</button>
      <div id="err" class="err"></div>
      <div class="muted">Accès réservé aux administrateurs.</div>
    </div>
    <script type="module" src="./login.js"></script>
  </body>
  </html>
