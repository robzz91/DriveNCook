<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Ventes</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;background:#fff;margin:0}
      header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding:12px}
      h1{color:#d32;margin:0}
      .bar{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #eee}
      input{padding:8px;border:1px solid #ccc;border-radius:6px}
      table{width:100%;border-collapse:separate;border-spacing:0}
      thead th{position:sticky;top:0;background:#111;color:#fff;border-bottom:3px solid #ffcc00}
      th,td{padding:12px 14px;border-bottom:1px solid #eee;text-align:left;font-size:15px}
      tbody tr:nth-child(odd){background:#fafafa}
      tbody tr:hover{background:#fff8e1}
      .btn{background:#ffcc00;border:none;padding:6px 10px;border-radius:6px}
    </style>
  </head>
  <body>
    <header style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin:0;background:#111;color:#fff;border-bottom:3px solid #ffcc00">
      <h1 style="color:#ffcc00;margin:0">Drive'N'Cook — Administration - Ventes</h1>
      <nav style="display:flex;gap:10px;align-items:center">
        <a href="./index.html" style="background:#222;color:#fff;padding:6px 10px;border-radius:6px;text-decoration:none;border:1px solid #333">Accueil</a>
        <a href="./users.html" style="background:#222;color:#fff;padding:6px 10px;border-radius:6px;text-decoration:none;border:1px solid #333">Utilisateurs</a>
        <a href="./franchisees.html" style="background:#222;color:#fff;padding:6px 10px;border-radius:6px;text-decoration:none;border:1px solid #333">Franchisés</a>
        <a href="./warehouses.html" style="background:#222;color:#fff;padding:6px 10px;border-radius:6px;text-decoration:none;border:1px solid #333">Entrepôts</a>
        <a href="./trucks.html" style="background:#222;color:#fff;padding:6px 10px;border-radius:6px;text-decoration:none;border:1px solid #333">Camions</a>
        <a href="./supplies.html" style="background:#222;color:#fff;padding:6px 10px;border-radius:6px;text-decoration:none;border:1px solid #333">Approvisionnements</a>
        <a href="./sales.html" style="background:#222;color:#fff;padding:6px 10px;border-radius:6px;text-decoration:none;border:1px solid #333">Ventes</a>
      </nav>
    </header>
    <section class="bar">
      <input id="fFrName" placeholder="Franchisé (nom)" />
      <button id="btnFilter" class="btn">Filtrer</button>
      <button id="btnExportFr" class="btn">Exporter PDF par franchisé</button>
    </section>
    <section>
      <table>
        <thead><tr><th>Franchisé</th><th>Montant</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <dialog id="dlgExport">
      <h3>Exporter PDF par franchisé</h3>
      <input id="exSearch" placeholder="Rechercher franchisé (nom)" />
      <div id="exList" style="max-height:220px;overflow:auto;margin-top:8px"></div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><button id="dlgCloseExport" class="btn">Fermer</button></div>
    </dialog>

    <script type="module" src="./sales.js"></script>
  </body>
  </html>
